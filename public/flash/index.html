    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Design system Bauhaus -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/flash.css?v=20261117-flash">
    <link rel="stylesheet" href="/shared/css/flash-booking.css?v=20261117-flash">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/wo-icons.js" defer></script>

    <script src="/shared/js/wo-consent.js" defer></script>
</head>
<body class="wo-app fb-body">

    <header class="wo-topbar fb-topbar">
        <div class="wo-topbar-left">
            <a href="/inicio" class="wo-topbar-brand" aria-label="We Ötzi inicio">
                <span class="wo-marks" aria-hidden="true">
                    <span class="wo-mark-square"></span>
                    <span class="wo-mark-circle"></span>
                    <span class="wo-mark-triangle"></span>
                </span>
                WE ÖTZI
            </a>
            <span class="fb-topbar-tag wo-meta-s">Reservar flash</span>
        </div>
        <div class="wo-topbar-right">
            <a class="wo-btn wo-btn--ghost wo-btn--s fb-cancel" id="fb-cancel" href="/marketplace">Cancelar</a>
        </div>
    </header>

    <!-- Flash Tattoos: reserva de un flash con precio fijo.
         /flash?artist=<usuario>&id=<id del flash>. El servidor (POST
         /api/flash/request) valida el flash contra la galería del artista y
         crea la cotización; esta página solo junta los datos del cliente. -->
    <main class="fb-main" id="fb-main" aria-live="polite">
        <p class="fb-loading"><span class="wo-spinner" aria-hidden="true"></span> Cargando el flash…</p>
    </main>
