<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Ingreso artista</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/artist-auth-ds.css">
    <script src="/shared/js/wo-icons.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/shared/js/config-manager.js?v=20260602-artist-dashboard-7"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/email-client.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/artist-registration-progress.js"></script>
    <script src="/shared/js/artist-auth.js?v=20260602-artist-dashboard-7"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/logging-loader.js?v=20260515-dashboard"></script>
</head>

<body class="wo-app wo-auth-body artist-login-page">
<a class="wo-skip-link" href="#login-content">Saltar al contenido</a>

<!-- Figma final del flujo de artista (oct 2026):
     801:585  "Iniciar sesión - Email y redes sociales"
     2001:3334 "Iniciar sesión - usuario registrado" (estado con sesión)
     Al entrar se muestra el loader post-auth (801:1099 · v1 / 2001:3335 · v2). -->
<div class="wo-auth-split">

    <aside class="wo-auth-poster" aria-hidden="true">
        <span class="wo-marks wo-auth-poster-marks">
            <span class="wo-mark-square"></span><span class="wo-mark-circle"></span><span class="wo-mark-triangle"></span>
        </span>
        <p class="wo-auth-poster-title">
            <span class="line">Accedé</span>
            <span class="line hl-blue">A tu</span>
            <span class="line hl-yellow">Panel</span>
        </p>
        <span class="wo-auth-poster-triangle"></span>
    </aside>

    <main class="wo-auth-panel" id="login-content" tabindex="-1">
        <div class="wo-auth-panel-inner">

            <a class="wo-auth-brand" href="/bienvenida" aria-label="We Ötzi — inicio">
                <span class="wo-marks">
                    <span class="wo-mark-square"></span><span class="wo-mark-circle"></span><span class="wo-mark-triangle"></span>
                </span>
                <span class="wo-auth-brand-name">We Ötzi</span>
            </a>

            <!-- Vista: login anónimo (801:585) -->
            <div id="login-anonymous-view" class="wo-auth-view">
                <div class="wo-auth-head">
                    <h1 class="wo-auth-title" id="artist-login-title">Bienvenida de nuevo</h1>
                    <p class="wo-auth-copy">Ingresá para gestionar tus spots y cotizaciones.</p>
                </div>

                <form id="login-form" class="wo-auth-form" onsubmit="handleArtistLogin(event)" novalidate>
                    <div class="wo-auth-field">
                        <label class="wo-auth-label" for="login-email">Email</label>
                        <div class="wo-auth-inputwrap">
                            <i data-wo-icon="mail" aria-hidden="true"></i>
                            <input type="email" id="login-email" class="wo-auth-input" placeholder="vos@email.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="wo-auth-field">
                        <label class="wo-auth-label" for="login-password">Contraseña</label>
                        <div class="wo-auth-inputwrap">
                            <i data-wo-icon="lock" aria-hidden="true"></i>
                            <input type="password" id="login-password" class="wo-auth-input" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="wo-auth-btn" id="btn-login">
                        <span class="btn-text">Entrar</span>
                        <i data-wo-icon="arrow-right" aria-hidden="true"></i>
                    </button>
                </form>

                <button type="button" class="wo-auth-forgot" onclick="handleArtistPasswordRecovery(event)">¿Olvidaste tu contraseña?</button>

                <div id="form-message" class="wo-auth-message" role="status" hidden></div>

                <div class="wo-auth-or" role="separator">O continuá con</div>

                <div class="wo-auth-social">
                    <span class="wo-auth-reco"><i data-wo-icon="star" aria-hidden="true"></i>Recomendado</span>
                    <div class="wo-auth-social-row">
                        <button type="button" class="wo-auth-social-btn" data-social="instagram" onclick="handleArtistSocialLogin('instagram')" aria-label="Continuar con Instagram: creá tu perfil importando tu Instagram">
                            <i data-wo-icon="instagram" aria-hidden="true"></i><span>Instagram</span>
                        </button>
                        <button type="button" class="wo-auth-social-btn" data-social="email" onclick="handleArtistSocialLogin('email')" aria-label="Recibir un link de acceso por email">
                            <i data-wo-icon="mail" aria-hidden="true"></i><span>Email</span>
                        </button>
                        <button type="button" class="wo-auth-social-btn" data-social="facebook" onclick="handleArtistSocialLogin('facebook')" aria-label="Continuar con Facebook">
                            <img class="wo-auth-brand-logo" src="/artist/login/assets/facebook.svg" width="17" height="17" alt="" aria-hidden="true"><span>Facebook</span>
                        </button>
                    </div>
                </div>

                <p class="wo-auth-foot">¿Sin cuenta? <a href="/registerclosedbeta">Registrate</a></p>
            </div>

            <!-- Vista: sesión activa (2001:3334) -->
            <div id="login-authenticated-view" class="wo-auth-view wo-auth-view--session" hidden>
                <div class="wo-auth-head">
                    <h2 class="wo-auth-title" id="auth-view-title">Ya iniciaste sesión</h2>
                    <p class="wo-auth-copy" id="auth-view-subcopy">Continuá desde tu panel de artista</p>
                </div>

                <div id="auth-view-progress-note" class="wo-auth-message" role="status" hidden></div>

                <div class="wo-auth-actions" id="auth-view-actions">
                    <!-- Botones inyectados por artist-login.js -->
                </div>

                <p class="wo-auth-foot wo-auth-foot--logout">
                    <button type="button" class="wo-auth-logout" onclick="handleArtistLogout()">Cerrar sesión</button>
                </p>
            </div>

        </div>
    </main>

</div>

<script src="/shared/js/wo-postauth-loader.js"></script>
<script src="/shared/js/artist-login.js?v=20261028-figma-final"></script>
</body>
</html>
