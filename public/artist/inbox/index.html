<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE ÖTZI | Inbox</title>
    <meta name="description" content="Inbox del artista: clientes, cotizaciones, soporte, invitaciones, Spots, Job Board, estudios y viajes en un solo lugar.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Design system Bauhaus -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/ds/organisms.css">
    <link rel="stylesheet" href="/shared/css/artist-inbox-ds.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <script src="/shared/js/ds/organisms.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="wo-app ai-page">

    <!-- TopBar canónica compartida de artista · INBOX activo -->
    <weotzi-product-nav
        active="inbox"
        menu-toggle-id="ai-menu-toggle"
        menu-id="ai-mobile-menu"
        menu-class="ai-mobile-menu"
        profile-label="Centro de la cuenta"
        logout-id="ai-logout"
        badge-item="inbox"
        badge-id="ai-nav-unread"
        badge-class="ai-navcount">
    </weotzi-product-nav>

    <main class="ai-shell" id="ai-shell">

        <!-- Zona 1 · Sidebar de filtros -->
        <aside class="ai-side" aria-label="Filtros del inbox">
            <h1 class="ai-side-title">Mensajes</h1>

            <div class="ai-search">
                <i data-wo-icon="search" class="wo-icon-18 ai-search-ic" aria-hidden="true"></i>
                <input type="search" id="ai-search" class="wo-input ai-search-input" placeholder="Buscar conversación…" aria-label="Buscar conversación" autocomplete="off">
            </div>

            <nav class="ai-side-list" aria-label="Categorías">
                <button type="button" class="wo-sidebar-item ai-side-item is-active" data-filter="all">Todos<span class="ai-side-count wo-mono-num" id="ai-count-all">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="clients">Clientes<span class="ai-side-count wo-mono-num" id="ai-count-clients">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="quotations">Cotizaciones<span class="ai-side-count wo-mono-num" id="ai-count-quotations">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="support">Soporte<span class="ai-side-count wo-mono-num" id="ai-count-support">1</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="invitations">Invitaciones<span class="ai-side-count wo-mono-num" id="ai-count-invitations">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="spots">Spots<span class="ai-side-count wo-mono-num" id="ai-count-spots">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="job_board">Job Board<span class="ai-side-count wo-mono-num" id="ai-count-job-board">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="studios">Estudios<span class="ai-side-count wo-mono-num" id="ai-count-studios">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="trips">Viajes<span class="ai-side-count wo-mono-num" id="ai-count-trips">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="archived">Archivados<span class="ai-side-count wo-mono-num" id="ai-count-archived">0</span></button>
                <button type="button" class="wo-sidebar-item ai-side-item" data-filter="favorites">Favoritas<span class="ai-side-count wo-mono-num" id="ai-count-favorites">0</span></button>
            </nav>

            <div class="ai-summary" aria-label="Resumen">
                <p class="wo-eyebrow ai-summary-cap">RESUMEN</p>
                <div class="ai-summary-row"><span>Sin leer</span><span class="wo-mono-num ai-sum-n is-waiting" id="ai-sum-unread">0</span></div>
                <div class="ai-summary-row"><span>Respondidas</span><span class="wo-mono-num ai-sum-n" id="ai-sum-replied">0</span></div>
                <div class="ai-summary-row"><span>Esperando respuesta</span><span class="wo-mono-num ai-sum-n is-waiting" id="ai-sum-waiting">0</span></div>
            </div>
        </aside>

        <!-- Zona 2 · Lista de conversaciones -->
        <section class="ai-listcol" aria-label="Conversaciones">
            <header class="ai-list-head">
                <span class="wo-meta" id="ai-list-cap">TODAS · 0</span>
            </header>
            <div class="ai-list" id="ai-list" role="list">
                <div class="ai-list-loading" id="ai-list-loading">
                    <span class="wo-spinner" aria-hidden="true"></span>
                    <span class="wo-meta-s">Cargando conversaciones</span>
                </div>
            </div>
        </section>

        <!-- Zona 3 · Hilo -->
        <section class="ai-threadcol" id="ai-threadcol" aria-label="Conversación">
            <div class="wo-empty ai-thread-placeholder" id="ai-thread-placeholder">
                <i data-wo-icon="message-circle" aria-hidden="true"></i>
                <span class="wo-empty-title">Elegí una conversación</span>
                <p>Acá vas a ver tus mensajes con clientes, estudios y el equipo de soporte.</p>
            </div>

            <div class="ai-thread" id="ai-thread" hidden>
                <header class="ai-thread-head" id="ai-thread-head"></header>
                <div class="ai-messages" id="ai-messages" aria-live="polite"></div>
                <div class="ai-support-empty" id="ai-support-empty" hidden>
                    <div class="wo-empty">
                        <i data-wo-icon="life-buoy" aria-hidden="true"></i>
                        <span class="wo-empty-title">Todavía no hablaste con soporte</span>
                        <p>Si necesitás ayuda con tu cuenta o tus cotizaciones, escribinos.</p>
                        <button type="button" class="wo-btn" id="ai-support-cta" hidden>Abrir chat de soporte</button>
                    </div>
                </div>
                <form class="ai-composer" id="ai-composer" autocomplete="off">
                    <input type="file" id="ai-file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain" hidden>
                    <div class="ai-composer-tools" aria-label="Adjuntos">
                        <button type="button" class="wo-iconbtn ai-attach" id="ai-attach" aria-label="Adjuntar archivo" title="Adjuntar archivo"><i data-wo-icon="paperclip" class="wo-icon-18" aria-hidden="true"></i></button>
                        <button type="button" class="wo-iconbtn ai-attach" id="ai-image" aria-label="Adjuntar imagen" title="Adjuntar imagen"><i data-wo-icon="image" class="wo-icon-18" aria-hidden="true"></i></button>
                        <button type="button" class="wo-iconbtn ai-attach" id="ai-emoji" aria-label="Agregar emoji" title="Agregar emoji"><i data-wo-icon="smile" class="wo-icon-18" aria-hidden="true"></i></button>
                    </div>
                    <div class="ai-composer-stack">
                        <div class="ai-attachment-preview" id="ai-attachment-preview" hidden></div>
                        <input type="text" id="ai-input" class="wo-input ai-composer-input" placeholder="Escribí un mensaje…" aria-label="Mensaje" maxlength="2000">
                    </div>
                    <button type="submit" class="wo-btn ai-send" id="ai-send" disabled><i data-wo-icon="send" class="wo-icon-18" aria-hidden="true"></i>Enviar</button>
                </form>
            </div>
        </section>

        <!-- Zona 4 · Panel de contexto -->
        <aside class="ai-context" id="ai-context" aria-label="Contexto de la conversación" hidden></aside>

    </main>

    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/support-client-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/inbox-repo.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/artist-inbox.js"></script>
    <script src="/shared/js/wo-artist-menu.js" defer></script>
</body>
</html>
