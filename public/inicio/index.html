<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Inicio</title>
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <script src="/inicio/inicio.js" defer></script>
    <link rel="stylesheet" href="/inicio/inicio.css">
    <style>
        /* Ilustraciones actuales conservadas; no son los placeholders de Figma. */
        .inicio-media{position:relative;background:var(--surface-media);overflow:hidden}
        .inicio-media span{position:absolute}
        .im-circle{width:180px;height:180px;border-radius:var(--radius-circle);background:var(--bauhaus-circle);top:32px;left:44px}
        .im-square{width:120px;height:120px;background:var(--bauhaus-square);bottom:-24px;right:104px}
        .im-triangle{width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:140px solid var(--bauhaus-triangle);top:56px;right:-36px}
        .inicio-media--alt .im-circle{left:auto;right:44px}
        .inicio-media--alt .im-square{right:auto;left:104px}
        .inicio-media--alt .im-triangle{right:auto;left:-36px}

    </style>
</head>
<body class="wo-app">
    <header class="wo-topbar inicio-topbar">
        <a class="wo-topbar-brand" href="/inicio">
            <span class="wo-marks">
                <span class="wo-mark-square"></span>
                <span class="wo-mark-circle"></span>
                <span class="wo-mark-triangle"></span>
            </span>
            WE ÖTZI
        </a>
    </header>

    <main class="wo-container inicio-main">
        <header class="inicio-head">
            <h1 class="inicio-title">¡Bienvenido!<br>¿Cómo querés usar We Ötzi?</h1>
            <p class="inicio-sub">Elegí la experiencia que mejor se adapte a vos. Vas a poder cambiar esta opción más adelante desde tu perfil.</p>
        </header>

        <form id="inicio-selection" aria-label="Elegí tu experiencia">
        <div class="inicio-cards">
            <label class="inicio-card">
                <input class="inicio-radio" type="radio" name="experience" value="client" aria-label="Quiero tatuarme">
                <span class="inicio-selected" aria-hidden="true"><i data-wo-icon="check"></i></span>
                <div class="inicio-media" aria-hidden="true">
                    <span class="im-circle"></span>
                    <span class="im-square"></span>
                    <span class="im-triangle"></span>
                </div>
                <div class="wo-card-body inicio-body">
                    <span class="wo-tag wo-tag--soft">Cliente</span>
                    <h2 class="inicio-card-title">Quiero tatuarme</h2>
                    <p class="inicio-card-desc">Encontrá artistas, explorá portafolios, pedí cotizaciones y agendá tu próxima sesión.</p>
                    <ul class="inicio-feats">
                        <li><i data-wo-icon="search" class="wo-icon-18" aria-hidden="true"></i>Explorar artistas</li>
                        <li><i data-wo-icon="grid" class="wo-icon-18" aria-hidden="true"></i>Comparar estilos</li>
                        <li>Solicitar cotizaciones</li>
                        <li><i data-wo-icon="calendar" class="wo-icon-18" aria-hidden="true"></i>Reservar citas</li>
                    </ul>
                    <span class="wo-meta inicio-cta">Continuar como cliente <i data-wo-icon="arrow-right" class="wo-icon-18" aria-hidden="true"></i></span>
                </div>
            </label>

            <label class="inicio-card">
                <input class="inicio-radio" type="radio" name="experience" value="artist" aria-label="Soy tatuador" checked>
                <span class="inicio-selected" aria-hidden="true"><i data-wo-icon="check"></i></span>
                <div class="inicio-media inicio-media--alt" aria-hidden="true">
                    <span class="im-circle"></span>
                    <span class="im-square"></span>
                    <span class="im-triangle"></span>
                </div>
                <div class="wo-card-body inicio-body">
                    <span class="wo-tag wo-tag--soft">Artista</span>
                    <h2 class="inicio-card-title">Soy tatuador</h2>
                    <p class="inicio-card-desc">Creá tu portafolio, recibí solicitudes, gestioná reservas y conseguí nuevos clientes.</p>
                    <ul class="inicio-feats">
                        <li><i data-wo-icon="image" class="wo-icon-18" aria-hidden="true"></i>Publicar portafolio</li>
                        <li><i data-wo-icon="inbox" class="wo-icon-18" aria-hidden="true"></i>Recibir solicitudes</li>
                        <li><i data-wo-icon="calendar" class="wo-icon-18" aria-hidden="true"></i>Gestionar agenda</li>
                        <li><i data-wo-icon="bar-chart-2" class="wo-icon-18" aria-hidden="true"></i>Ver estadísticas</li>
                    </ul>
                    <span class="wo-meta inicio-cta">Continuar como tatuador <i data-wo-icon="arrow-right" class="wo-icon-18" aria-hidden="true"></i></span>
                </div>
            </label>
        </div>
        </form>

        <div class="inicio-actions"><a id="inicio-continue" class="wo-btn inicio-continue" href="/artist/login/">CONTINUAR <i data-wo-icon="arrow-right" aria-hidden="true"></i></a></div>
        <p class="inicio-note">Podrás cambiar esta experiencia en cualquier momento desde la configuración de tu cuenta.</p>
    </main>
</body>
</html>
