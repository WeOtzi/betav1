<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Inicio</title>
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/inicio-figma.css">
    <script src="/shared/js/inicio.js" defer></script>
</head>
<body class="wo-app inicio-page">
    <header class="wo-topbar inicio-topbar">
        <a class="wo-topbar-brand" href="/inicio">
            <span class="wo-marks">
                <span class="wo-mark-square"></span>
                <span class="wo-mark-circle"></span>
                <span class="wo-mark-triangle"></span>
            </span>
            WE ÖTZI
        </a>
    </header>

    <main class="wo-container inicio-main">
        <header class="inicio-head">
            <h1 class="inicio-title">¡Bienvenido!<br>¿Cómo querés usar We Ötzi?</h1>
            <p class="inicio-sub">Elegí la experiencia que mejor se adapte a vos. Vas a poder cambiar esta opción más adelante desde tu perfil.</p>
        </header>

        <div class="inicio-cards" role="radiogroup" aria-label="Elegí tu experiencia">
            <label class="wo-card wo-card--media inicio-card">
                <input class="inicio-choice" type="radio" name="experiencia" value="cliente" data-destination="/marketplace" aria-label="Quiero tatuarme">
                <div class="inicio-media" aria-hidden="true">
                    <img src="/shared/images/inicio/image.svg" alt="" class="inicio-placeholder-icon">
                    <span class="inicio-placeholder-caption">Ilustración editorial: persona buscando inspiración para un tatuaje</span>
                    <span class="inicio-placeholder-browse">or <u>browse files</u></span>
                </div>
                <span class="inicio-selected" aria-hidden="true"><img src="/shared/images/inicio/check.svg" alt=""></span>
                <div class="wo-card-body inicio-body">
                    <span class="wo-tag wo-tag--soft">Cliente</span>
                    <h2 class="inicio-card-title">Quiero tatuarme</h2>
                    <p class="inicio-card-desc">Encontrá artistas, explorá portafolios, pedí cotizaciones y agendá tu próxima sesión.</p>
                    <ul class="inicio-feats">
                        <li><img src="/shared/images/inicio/search.svg" alt="" class="wo-icon-18" aria-hidden="true">Explorar artistas</li>
                        <li><img src="/shared/images/inicio/grid.svg" alt="" class="wo-icon-18" aria-hidden="true">Comparar estilos</li>
                        <li>Solicitar cotizaciones</li>
                        <li><img src="/shared/images/inicio/calendar.svg" alt="" class="wo-icon-18" aria-hidden="true">Reservar citas</li>
                    </ul>
                    <span class="wo-meta inicio-cta">Continuar como cliente <img src="/shared/images/inicio/arrow-right.svg" alt="" class="wo-icon-18" aria-hidden="true"></span>
                </div>
            </label>

            <label class="wo-card wo-card--media inicio-card">
                <input class="inicio-choice" type="radio" name="experiencia" value="artista" data-destination="/artist/login" aria-label="Soy tatuador" checked>
                <div class="inicio-media inicio-media--alt" aria-hidden="true">
                    <img src="/shared/images/inicio/image.svg" alt="" class="inicio-placeholder-icon">
                    <span class="inicio-placeholder-caption">Ilustración editorial: tatuador trabajando</span>
                    <span class="inicio-placeholder-browse">or <u>browse files</u></span>
                </div>
                <span class="inicio-selected" aria-hidden="true"><img src="/shared/images/inicio/check.svg" alt=""></span>
                <div class="wo-card-body inicio-body">
                    <span class="wo-tag wo-tag--soft">Artista</span>
                    <h2 class="inicio-card-title">Soy tatuador</h2>
                    <p class="inicio-card-desc">Creá tu portafolio, recibí solicitudes, gestioná reservas y conseguí nuevos clientes.</p>
                    <ul class="inicio-feats">
                        <li><img src="/shared/images/inicio/image.svg" alt="" class="wo-icon-18" aria-hidden="true">Publicar portafolio</li>
                        <li><img src="/shared/images/inicio/inbox.svg" alt="" class="wo-icon-18" aria-hidden="true">Recibir solicitudes</li>
                        <li><img src="/shared/images/inicio/calendar.svg" alt="" class="wo-icon-18" aria-hidden="true">Gestionar agenda</li>
                        <li><img src="/shared/images/inicio/bar-chart-2.svg" alt="" class="wo-icon-18" aria-hidden="true">Ver estadísticas</li>
                    </ul>
                    <span class="wo-meta inicio-cta">Continuar como tatuador <img src="/shared/images/inicio/arrow-right.svg" alt="" class="wo-icon-18" aria-hidden="true"></span>
                </div>
            </label>
        </div>

        <div class="inicio-actions"><a class="wo-btn inicio-continue" href="/artist/login">CONTINUAR <img src="/shared/images/inicio/arrow-right.svg" alt="" aria-hidden="true"></a></div>
        <p class="inicio-note">Podrás cambiar esta experiencia en cualquier momento desde la configuración de tu cuenta.</p>
    </main>
</body>
</html>
