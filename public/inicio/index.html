<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Inicio</title>
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <style>
        /* Página Inicio (selector de rol) — solo tokens del DS, cero hex sueltos */
        .inicio-topbar{justify-content:flex-start}
        .inicio-main{padding-top:var(--space-12);padding-bottom:var(--space-16)}
        .inicio-head{max-width:640px;margin:0 auto var(--space-10);text-align:center;display:flex;flex-direction:column;gap:var(--space-4)}
        .inicio-title{font-family:var(--font-display);font-size:clamp(28px,3.2vw,38px);line-height:1.15;letter-spacing:var(--h2-track);color:var(--text-heading);margin:0}
        .inicio-sub{margin:0;font-size:var(--body-m-size);line-height:var(--body-m-lh);color:var(--text-muted)}

        .inicio-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-8);max-width:1120px;margin:0 auto}
        .inicio-card{display:flex;flex-direction:column;color:inherit;position:relative;cursor:pointer}
        .inicio-card:hover,.inicio-card:active{color:inherit;text-decoration:none}
        .inicio-card:has(.inicio-choice:checked){border-color:var(--blue-400);background:var(--info-bg)}
        .inicio-card:has(.inicio-choice:focus-visible){box-shadow:var(--shadow-focus)}
        .inicio-check{position:absolute;top:var(--space-4);right:var(--space-4);z-index:1;visibility:hidden}
        .inicio-card:has(.inicio-choice:checked) .inicio-check{visibility:visible;color:var(--blue-400)}
        .inicio-check i:empty{align-items:center;justify-content:center}
        .inicio-check i:empty::after{content:"";display:block;width:7px;height:11px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}

        .inicio-media{height:280px;background:var(--surface-media);border-bottom:var(--border-hairline) solid var(--border-subtle)}

        .inicio-body{display:flex;flex-direction:column;gap:var(--space-4);flex:1}
        .inicio-card-title{font-family:var(--font-display);font-size:26px;line-height:1.1;color:var(--text-heading);margin:0}
        .inicio-card-desc{margin:0;font-size:var(--body-s-size);line-height:var(--body-s-lh);color:var(--text-muted)}
        .inicio-card .wo-tag{align-self:flex-start}
        .inicio-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)}
        .inicio-feats li{display:flex;align-items:center;gap:var(--space-3);font-size:var(--body-s-size);color:var(--text-body)}
        .inicio-feats [data-wo-icon]{color:var(--text-muted)}
        .inicio-cta{display:inline-flex;align-items:center;gap:var(--space-2);margin-top:auto;padding-top:var(--space-4);color:var(--text-muted)}
        .inicio-card:hover .inicio-cta{color:var(--text-heading)}
        .inicio-actions{display:flex;justify-content:center;margin-top:var(--space-8)}

        .inicio-note{margin:var(--space-10) auto 0;max-width:640px;text-align:center;font-size:var(--body-s-size);line-height:var(--body-s-lh);color:var(--text-faint)}

        @media (max-width:1024px){
            .inicio-cards{grid-template-columns:1fr;max-width:560px}
        }
        @media (max-width:480px){
            .inicio-media{height:200px}
            .inicio-main{padding-top:var(--space-8)}
        }
    </style>
</head>
<body class="wo-app">
    <header class="wo-topbar inicio-topbar">
        <a class="wo-topbar-brand" href="/inicio">
            <span class="wo-marks">
                <span class="wo-mark-square"></span>
                <span class="wo-mark-circle"></span>
                <span class="wo-mark-triangle"></span>
            </span>
            WE ÖTZI
        </a>
    </header>

    <main class="wo-container inicio-main">
        <header class="inicio-head">
            <h1 class="inicio-title">¡Bienvenido!<br>¿Cómo querés usar We Ötzi?</h1>
            <p class="inicio-sub">Elegí la experiencia que mejor se adapte a vos. Vas a poder cambiar esta opción más adelante desde tu perfil.</p>
        </header>

        <div class="inicio-cards">
            <label class="wo-card wo-card--media wo-card--hover inicio-card">
                <input class="wo-sr-only inicio-choice" type="radio" name="inicio-role" value="client">
                <span class="inicio-check" aria-hidden="true"><i data-wo-icon="check" class="wo-icon-18"></i></span>
                <div class="inicio-media" aria-hidden="true"></div>
                <div class="wo-card-body inicio-body">
                    <span class="wo-tag wo-tag--soft">Cliente</span>
                    <h2 class="inicio-card-title">Quiero tatuarme</h2>
                    <p class="inicio-card-desc">Encontrá artistas, explorá portafolios, pedí cotizaciones y agendá tu próxima sesión.</p>
                    <ul class="inicio-feats">
                        <li><i data-wo-icon="search" class="wo-icon-18" aria-hidden="true"></i>Explorar artistas</li>
                        <li><i data-wo-icon="grid" class="wo-icon-18" aria-hidden="true"></i>Comparar estilos</li>
                        <li><i data-wo-icon="file-text" class="wo-icon-18" aria-hidden="true"></i>Solicitar cotizaciones</li>
                        <li><i data-wo-icon="calendar" class="wo-icon-18" aria-hidden="true"></i>Reservar citas</li>
                    </ul>
                    <span class="wo-meta inicio-cta">Continuar como cliente <i data-wo-icon="arrow-right" class="wo-icon-18" aria-hidden="true"></i></span>
                </div>
            </label>

            <label class="wo-card wo-card--media wo-card--hover inicio-card">
                <input class="wo-sr-only inicio-choice" type="radio" name="inicio-role" value="artist">
                <span class="inicio-check" aria-hidden="true"><i data-wo-icon="check" class="wo-icon-18"></i></span>
                <div class="inicio-media" aria-hidden="true"></div>
                <div class="wo-card-body inicio-body">
                    <span class="wo-tag wo-tag--soft">Artista</span>
                    <h2 class="inicio-card-title">Soy tatuador</h2>
                    <p class="inicio-card-desc">Creá tu portafolio, recibí solicitudes, gestioná reservas y conseguí nuevos clientes.</p>
                    <ul class="inicio-feats">
                        <li><i data-wo-icon="image" class="wo-icon-18" aria-hidden="true"></i>Publicar portafolio</li>
                        <li><i data-wo-icon="inbox" class="wo-icon-18" aria-hidden="true"></i>Recibir solicitudes</li>
                        <li><i data-wo-icon="calendar" class="wo-icon-18" aria-hidden="true"></i>Gestionar agenda</li>
                        <li><i data-wo-icon="bar-chart-2" class="wo-icon-18" aria-hidden="true"></i>Ver estadísticas</li>
                    </ul>
                    <span class="wo-meta inicio-cta">Continuar como tatuador <i data-wo-icon="arrow-right" class="wo-icon-18" aria-hidden="true"></i></span>
                </div>
            </label>
        </div>

        <div class="inicio-actions">
            <button class="wo-btn wo-btn--direct wo-btn--hard" type="button" id="inicio-continue" disabled>Continuar →</button>
        </div>
        <p class="inicio-note">Podés cambiar esta experiencia en cualquier momento desde la configuración de tu cuenta.</p>
    </main>
    <script id="inicio-role-selection">
        const choices = document.querySelectorAll('input[name="inicio-role"]');
        const continueButton = document.getElementById('inicio-continue');
        choices.forEach(input => input.addEventListener('change', () => {
            continueButton.disabled = !document.querySelector('input[name="inicio-role"]:checked');
        }));
        continueButton.addEventListener('click', () => {
            const selected = document.querySelector('input[name="inicio-role"]:checked');
            if (!selected) return;
            window.location.href = selected.value === 'artist' ? '../landing-tatuador/' : '../marketplace/';
        });
    </script>
</body>
</html>
