<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Itinerario de gira</title>
    <meta name="description" content="Itinerario público de gira de un artista de We Ötzi: ciudad, fechas y tipo de viaje. Pedí tu cita.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Design system Bauhaus -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/artist-travel-ds.css">
    <script src="/shared/js/wo-icons.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="wo-app">

    <!-- Topbar liviana pública -->
    <header class="wo-topbar">
        <div class="wo-topbar-left">
            <a href="/inicio" class="wo-topbar-brand">WE ÖTZI</a>
        </div>
        <div class="wo-topbar-right">
            <span class="wo-o-tile" aria-hidden="true">Ö</span>
        </div>
    </header>

    <main class="tvs-share" id="ts-main">
        <div class="wo-container tvs-share-shell" id="ts-root">
            <div class="tvs-share-loading">
                <span class="wo-spinner" aria-hidden="true"></span>
                <p class="wo-meta">Cargando itinerario</p>
            </div>
        </div>
    </main>

    <footer class="tvl-footer">
        <div class="wo-container tvl-footer-inner">
            <span class="tvl-footer-brand">WE ÖTZI</span>
            <span class="wo-meta-s tvl-footer-meta">© 2026 We Ötzi · Todos los derechos reservados</span>
        </div>
    </footer>

    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/travel-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/travel-share.js"></script>
</body>
</html>
