<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Spots</title>
    <meta name="description" content="Directorio de spots abiertos en estudios de tatuaje: residencias, itinerantes y guest spots. Encontrá el próximo lugar donde tatuar.">

    <!-- Design system Bauhaus -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/ds/organisms.css">
    <link rel="stylesheet" href="/shared/css/studio-spots-ds.css">
    <link rel="stylesheet" href="/shared/css/studio-spots-figma.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <script src="/shared/js/ds/organisms.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="wo-app">

    <!-- TopBar compartida de artista -->
    <weotzi-product-nav
        active="spots"
        menu-toggle-id="spots-mobile-menu-toggle"
        menu-id="spots-mobile-menu"
        menu-class="sps-mobile-menu"
        profile-href="/artist/dashboard"
        profile-id="auth-nav-btn"
        profile-class="sps-auth sps-o-tile"
        profile-label-id="auth-nav-label"
        profile-label="Ingresá"
        logout-id="auth-logout"
        logout-class="sps-logout hidden">
    </weotzi-product-nav>

    <main class="sps-shell" id="spots-main">

        <!-- Vista 1 · Directorio -->
        <div id="spots-feed-view">
            <!-- Spot destacado, franja de ancho completo -->
            <section id="spots-feature" class="sps-feature-slot" aria-label="Spot destacado"></section>

            <!-- Mosaico editorial sobre fondo ink -->
            <section id="spots-mosaic" class="sps-mosaic" aria-label="Spots abiertos"></section>

            <!-- Cinta de spots que cierran -->
            <section id="spots-ribbon" class="sps-ribbon" aria-label="Spots que cierran pronto"></section>

            <div id="spots-empty" class="wo-empty hidden">
                <i data-wo-icon="inbox" aria-hidden="true"></i>
                <span class="wo-empty-title">No hay spots abiertos</span>
                <p>Volvé más tarde: los estudios publican sus posiciones acá.</p>
            </div>
        </div>

        <!-- Vista 2 · Detalle del spot + aside de postulación -->
        <div id="spot-detail-view" class="sps-detail hidden"></div>

        <!-- Vista 3 · Solicitud enviada -->
        <div id="spot-sent-view" class="sps-sent hidden"></div>
    </main>

    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/email-client.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/studio-spots-directory.js"></script>
    <script src="/shared/js/wo-artist-menu.js" defer></script>
</body>
</html>
