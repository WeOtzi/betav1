<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Apelar una sanción</title>
    <meta name="description" content="Apela la sanción de tu cuenta de We Ötzi: una sola vez, dentro de 30 días, desde el enlace del correo.">
    <meta name="robots" content="noindex, nofollow">
    <!-- El enlace lleva un token: no viaja como Referer a ninguna otra página. -->
    <meta name="referrer" content="no-referrer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Design system Bauhaus -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/apelacion.css?v=20261118-kyc">
    <!-- Consentimiento de cookies: único cargador de scripts no esenciales -->
    <script src="/shared/js/wo-consent.js" defer></script>
</head>
<body class="wo-app ap-body">

    <header class="wo-topbar">
        <div class="wo-topbar-left">
            <a href="/inicio" class="wo-topbar-brand" aria-label="We Ötzi inicio">
                <span class="wo-marks" aria-hidden="true">
                    <span class="wo-mark-square"></span>
                    <span class="wo-mark-circle"></span>
                    <span class="wo-mark-triangle"></span>
                </span>
                WE ÖTZI
            </a>
        </div>
    </header>

    <!-- Apelación de una sanción (2.7.0). /apelacion?t=<token del correo>.
         Sin sesión: la cuenta sancionada puede no poder iniciar sesión. El
         servidor (GET/POST /api/sanctions/appeal, lib/routes/sanciones.js)
         valida el token firmado, el plazo de 30 días y que sea la única
         apelación. -->
    <main class="wo-container ap-main" id="ap-main">
        <p class="wo-eyebrow ap-eyebrow">Seguridad de la cuenta</p>
        <h1 class="wo-h1 ap-title" id="ap-title" tabindex="-1">Apelar una sanción</h1>
        <div id="ap-root" aria-live="polite">
            <p class="ap-loading"><span class="wo-spinner" aria-hidden="true"></span> Cargando tu sanción…</p>
        </div>
        <p class="wo-help ap-foot">¿Dudas sobre cómo funcionan las sanciones? Lee <a href="/seguridad">Suplantación y plagio</a> o escribe a <a href="mailto:soporte@weotzi.com">soporte@weotzi.com</a>.</p>
    </main>

    <script src="/shared/js/apelacion.js?v=20261118-kyc"></script>
</body>
</html>
