<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Estudios — Acceder</title>
    <meta name="description" content="Acceso al panel del estudio en We Ötzi.">
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/artist-auth-ds.css">
    <link rel="stylesheet" href="/shared/css/artist-login-figma.css">
    <link rel="stylesheet" href="/shared/css/studio-login-ds.css">
    <script src="/shared/js/wo-icons.js" data-icon-base="../assets/feather-studio/" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="wo-app wo-auth-body artist-login-page studio-login-page">
    <a class="wo-skip-link" href="#login-content">Saltar al contenido</a>
    <div class="wo-auth-split">
        <aside class="wo-auth-poster" aria-hidden="true">
            <div class="wo-auth-poster-frame">
                <span class="wo-marks"><span class="wo-mark-square"></span><span class="wo-mark-circle"></span><span class="wo-mark-triangle"></span></span>
                <p class="wo-auth-poster-title" id="poster-login">
                    <span class="line">Accedé</span><span class="line hl-blue">A tu</span><span class="line hl-yellow">Estudio</span>
                </p>
                <p class="wo-auth-poster-title" id="poster-recovery" hidden>
                    <span class="line">Recuperá</span><span class="line hl-blue">Tu</span><span class="line hl-yellow">Acceso</span>
                </p>
            </div>
        </aside>
        <main class="wo-auth-panel" id="login-content" tabindex="-1">
            <div class="wo-auth-panel-inner">
                <a class="wo-auth-brand" href="/marketplace" aria-label="We Ötzi — ir a explorar">
                    <span class="wo-marks" aria-hidden="true"><span class="wo-mark-square"></span><span class="wo-mark-circle"></span><span class="wo-mark-triangle"></span></span>
                    <span class="wo-auth-brand-name">We Ötzi</span>
                </a>
                <div class="wo-auth-view">
                    <h1 class="wo-auth-title" id="studio-login-title">Bienvenido de vuelta</h1>
                    <p class="wo-auth-copy" id="studio-login-copy">Ingresá para gestionar tu estudio.</p>
                    <form id="studio-login-form" class="wo-auth-form" novalidate>
                        <div class="wo-field">
                            <label class="wo-label" for="login-email">Email del estudio</label>
                            <div class="wo-auth-inputwrap">
                                <img class="wo-auth-field-icon" src="/shared/assets/figma/artist-login/mail.svg" alt="">
                                <input type="email" id="login-email" class="wo-input" placeholder="vos@email.com" autocomplete="email" required aria-describedby="login-status">
                            </div>
                        </div>
                        <div class="wo-field">
                            <label class="wo-label" for="login-password">Contraseña</label>
                            <div class="wo-auth-inputwrap">
                                <img class="wo-auth-field-icon" src="/shared/assets/figma/artist-login/lock.svg" alt="">
                                <input type="password" id="login-password" class="wo-input" placeholder="••••••••" autocomplete="current-password" required aria-describedby="login-status">
                            </div>
                        </div>
                        <button type="submit" id="login-submit" class="wo-btn wo-btn--block wo-btn--hard">
                            <span>Acceder</span><img src="/shared/assets/figma/artist-login/arrow-right.svg" alt="">
                        </button>
                    </form>
                    <form id="studio-recovery-form" class="wo-auth-form" hidden novalidate>
                        <div id="studio-recovery-code-fields" class="studio-recovery-fields" hidden>
                            <div class="wo-field">
                                <label class="wo-label" for="recovery-email">Email de la cuenta</label>
                                <div class="wo-auth-inputwrap">
                                    <img class="wo-auth-field-icon" src="/shared/assets/figma/artist-login/mail.svg" alt="">
                                    <input type="email" id="recovery-email" class="wo-input" autocomplete="email" placeholder="vos@email.com" aria-describedby="login-status">
                                </div>
                            </div>
                            <div class="wo-field">
                                <label class="wo-label" for="recovery-code">Código recibido por correo</label>
                                <input id="recovery-code" class="wo-input" inputmode="numeric" autocomplete="one-time-code" maxlength="12" aria-describedby="login-status">
                            </div>
                        </div>
                        <div class="wo-field">
                            <label class="wo-label" for="recovery-password">Nueva contraseña</label>
                            <div class="wo-auth-inputwrap">
                                <img class="wo-auth-field-icon" src="/shared/assets/figma/artist-login/lock.svg" alt="">
                                <input type="password" id="recovery-password" class="wo-input" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required aria-describedby="recovery-password-help login-status">
                            </div>
                            <span class="wo-help" id="recovery-password-help">Usá al menos 8 caracteres.</span>
                        </div>
                        <div class="wo-field">
                            <label class="wo-label" for="recovery-confirm">Repetí la nueva contraseña</label>
                            <div class="wo-auth-inputwrap">
                                <img class="wo-auth-field-icon" src="/shared/assets/figma/artist-login/lock.svg" alt="">
                                <input type="password" id="recovery-confirm" class="wo-input" minlength="8" autocomplete="new-password" placeholder="••••••••" required aria-describedby="login-status">
                            </div>
                        </div>
                        <button type="submit" id="recovery-submit" class="wo-btn wo-btn--block wo-btn--hard">
                            <span>Guardar contraseña</span><img src="/shared/assets/figma/artist-login/arrow-right.svg" alt="">
                        </button>
                    </form>
                    <div id="login-status" class="studio-status studio-status-info" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden></div>
                    <div class="studio-login-help">
                        <button type="button" id="forgot-password-link" class="wo-auth-forgot">¿Olvidaste tu contraseña?</button>
                        <button type="button" id="have-recovery-code" class="wo-auth-back">Ya tengo un código</button>
                        <button type="button" id="studio-back-to-login" class="wo-auth-back" hidden><i data-wo-icon="arrow-left" aria-hidden="true"></i>Volver al inicio de sesión</button>
                    </div>
                    <div class="wo-auth-links">
                        <p class="wo-meta">¿Aún no tenés cuenta? <a href="/studio/register">Registrar tu estudio</a></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/email-client.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/weotzi-uploader.js"></script>
    <script src="/shared/js/studio-registration-media.js"></script>
    <script src="/shared/js/studio-auth.js"></script>
    <script src="/shared/js/studio-login.js"></script>
</body>
</html>
