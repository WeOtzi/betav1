<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Ingreso de clientes</title>
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/client-auth-ds.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/email-client.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/logging-loader.js"></script>
</head>
<body class="wo-app ca-page">
    <div class="ca-split">
        <aside class="ca-hero" aria-hidden="true">
            <div class="ca-hero-inner">
                <span class="wo-marks ca-marks-lg">
                    <span class="wo-mark-square"></span>
                    <span class="wo-mark-circle"></span>
                    <span class="wo-mark-triangle"></span>
                </span>
                <p class="ca-hero-title">
                    <span class="l1">Accedé</span><br>
                    <span class="l2">a tu</span><br>
                    <span class="l3">panel</span>
                </p>
            </div>
            <span class="ca-hero-deco"></span>
        </aside>

        <main class="ca-form-col" id="login-content">
            <div class="ca-form">
                <a class="ca-brand" href="/inicio" aria-label="We Ötzi · inicio">
                    <span class="wo-marks ca-marks-lg">
                        <span class="wo-mark-square"></span>
                        <span class="wo-mark-circle"></span>
                        <span class="wo-mark-triangle"></span>
                    </span>
                    <span class="ca-wordmark">WE ÖTZI</span>
                </a>

                <div class="ca-head">
                    <h1 class="ca-title" id="client-login-title">Bienvenida de nuevo</h1>
                    <p class="ca-subtitle">Ingresá para seguir tus cotizaciones y proyectos.</p>
                </div>

                <form id="login-form" class="ca-fields" onsubmit="handleClientLogin(event)">
                    <div class="wo-field">
                        <label class="wo-label" for="login-email">Email</label>
                        <div class="ca-input-wrap">
                            <i data-wo-icon="mail" class="wo-icon-18" aria-hidden="true"></i>
                            <input type="email" id="login-email" class="wo-input" placeholder="vos@email.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="wo-field">
                        <label class="wo-label" for="login-password">Contraseña</label>
                        <div class="ca-input-wrap">
                            <i data-wo-icon="lock" class="wo-icon-18" aria-hidden="true"></i>
                            <input type="password" id="login-password" class="wo-input" placeholder="Tu contraseña" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="wo-btn wo-btn--block wo-btn--hard" id="btn-login">
                        <span class="btn-text">Entrar</span>
                        <i data-wo-icon="arrow-right" class="wo-icon-18" aria-hidden="true"></i>
                    </button>
                </form>

                <div id="form-message" class="form-message"></div>

                <div class="ca-divider" aria-hidden="true">O continuá con</div>

                <div class="ca-oauth">
                    <span class="wo-badge wo-badge--accent wo-badge--s">Recomendado</span>
                    <button type="button" class="wo-btn wo-btn--ghost wo-btn--block wo-btn--hard" onclick="handleGoogleLogin()">
                        <svg class="ca-google-g" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
                        </svg>
                        Continuar con Google
                    </button>
                </div>

                <div class="ca-links">
                    <p><a href="#" onclick="handlePasswordRecovery(event); return false;">Olvidé mi contraseña</a></p>
                    <p>¿Sin cuenta? <a href="/client/register">Registrate</a></p>
                    <p>¿Sos artista? <a href="/registerclosedbeta">Accedé acá</a></p>
                </div>
            </div>
        </main>
    </div>

    <script src="/shared/js/client-auth.js"></script>
</body>
</html>
