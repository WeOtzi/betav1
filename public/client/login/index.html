<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Ingreso de clientes</title>
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/client-auth-ds.css">
    <link rel="stylesheet" href="/shared/css/client-login-figma.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/email-client.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/logging-loader.js"></script>
</head>
<body class="wo-app ca-page client-login-page">
    <div class="ca-split">
        <aside class="ca-hero" aria-hidden="true">
            <div class="ca-hero-inner">
                <span class="wo-marks ca-marks-lg">
                    <span class="wo-mark-square"></span>
                    <span class="wo-mark-circle"></span>
                    <span class="wo-mark-triangle"></span>
                </span>
                <p class="ca-hero-title">
                    <span class="l1">Accedé</span><br>
                    <span class="l2">a tu</span><br>
                    <span class="l3">panel</span>
                </p>
            </div>
            <span class="ca-hero-deco"></span>
        </aside>

        <main class="ca-form-col" id="login-content">
            <div class="ca-form">
                <a class="ca-brand" href="/inicio" aria-label="We Ötzi · inicio">
                    <span class="wo-marks ca-marks-lg">
                        <span class="wo-mark-square"></span>
                        <span class="wo-mark-circle"></span>
                        <span class="wo-mark-triangle"></span>
                    </span>
                    <span class="ca-wordmark">WE ÖTZI</span>
                </a>

                <div class="ca-head">
                    <h1 class="ca-title" id="client-login-title">Bienvenida de nuevo</h1>
                    <p class="ca-subtitle">Ingresá para gestionar tus citas y cotizaciones.</p>
                </div>

                <form id="login-form" class="ca-fields" onsubmit="handleClientLogin(event)">
                    <div class="wo-field">
                        <label class="wo-label" for="login-email">Email</label>
                        <div class="ca-input-wrap">
                            <img class="ca-field-icon" src="/shared/assets/figma/artist-login/mail.svg" alt="">
                            <input type="email" id="login-email" class="wo-input" placeholder="vos@email.com" required autocomplete="email">
                        </div>
                    </div>
                    <div class="wo-field">
                        <label class="wo-label" for="login-password">Contraseña</label>
                        <div class="ca-input-wrap">
                            <img class="ca-field-icon" src="/shared/assets/figma/artist-login/lock.svg" alt="">
                            <input type="password" id="login-password" class="wo-input" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="wo-btn wo-btn--block wo-btn--hard" id="btn-login">
                        <span class="btn-text">Entrar</span>
                        <img src="/shared/assets/figma/artist-login/arrow-right.svg" alt="">
                    </button>
                </form>

                <div id="form-message" class="form-message" role="status"></div>

                <div class="ca-divider" aria-hidden="true">O continuá con</div>

                <div class="ca-oauth">
                    <span class="wo-badge wo-badge--accent wo-badge--s ca-reco"><img src="/shared/assets/figma/artist-login/star.svg" alt="">Recomendado</span>
                    <div class="ca-social-buttons">
                        <button type="button" class="wo-btn wo-btn--ghost" onclick="handleClientSocialUnavailable('Instagram')" aria-describedby="social-access-message">
                            <img src="/shared/assets/figma/artist-login/instagram.svg" alt=""><span>Instagram</span>
                        </button>
                        <button type="button" class="wo-btn wo-btn--ghost" onclick="focusClientEmailLogin()">
                            <img src="/shared/assets/figma/artist-login/email.svg" alt=""><span>Email</span>
                        </button>
                        <button type="button" class="wo-btn wo-btn--ghost" onclick="handleClientSocialUnavailable('Facebook')" aria-describedby="social-access-message">
                            <img src="/shared/assets/figma/artist-login/facebook.svg" alt=""><span>Facebook</span>
                        </button>
                    </div>
                    <div id="social-access-notice" class="ca-social-notice" hidden>
                        <p id="social-access-message" role="status"></p>
                        <button type="button" class="wo-btn wo-btn--ghost" onclick="handleGoogleLogin()">Continuar con Google</button>
                    </div>
                </div>

                <div class="ca-links">
                    <p>¿Sin cuenta? <a href="/client/register">Registrate</a></p>
                </div>
            </div>
        </main>
    </div>

    <script src="/shared/js/client-auth.js"></script>
    <script src="/shared/js/client-login.js"></script>
</body>
</html>
