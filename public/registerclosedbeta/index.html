<head>
    <meta charset="UTF-8">

            var id = window.CLARITY_PROJECT_ID;

            (function(c,l,a,r,i,t,y){
                c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
            })(window,document,"clarity","script",id);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/shared/css/ds/tokens.css">

    <link rel="stylesheet" href="/shared/css/instagram-import.css">
    <script src="/shared/js/wo-icons.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>

<body class="wo-app registerclosedbeta-page">
<a class="wo-skip-link" href="#register-content">Saltar al contenido</a>

<!-- =====================================================
     Figma final (oct 2026) · 801:536 "Crear cuenta - Email y
     redes sociales": póster ink 720px + panel crema con el
     formulario de 468px. Sin topbar.
     ===================================================== -->
<div class="wo-auth-split">

    <aside class="wo-auth-poster" aria-hidden="true">
        <span class="wo-marks wo-auth-poster-marks">
            <span class="wo-mark-square"></span><span class="wo-mark-circle"></span><span class="wo-mark-triangle"></span>
        </span>
        <span class="wo-auth-poster-eyebrow">[ Acceso anticipado · beta cerrada ]</span>
        <p class="wo-auth-poster-title">
            <span class="line">Tu próximo</span>
            <span class="line hl-blue">Proyecto</span>
            <span class="line hl-yellow">Está acá</span>
        </p>
        <p class="wo-auth-poster-manifesto">El artista merece más apoyo y menos complicaciones. Crecer y conectar — gratis para siempre.</p>
        <span class="wo-auth-poster-triangle"></span>
    </aside>

    <main class="wo-auth-panel" id="register-content" tabindex="-1">
        <div class="wo-auth-panel-inner">

            <a class="wo-auth-brand" href="/bienvenida" aria-label="We Ötzi — inicio">
                <span class="wo-marks" aria-hidden="true">
                    <span class="wo-mark-square"></span><span class="wo-mark-circle"></span><span class="wo-mark-triangle"></span>
                </span>
                <span class="wo-auth-brand-name">We Ötzi</span>
            </a>

            <div class="wo-auth-view">
                <div class="wo-auth-head">
                    <h1 class="wo-auth-title">Creá tu cuenta</h1>
                    <p class="wo-auth-copy">Empezá hoy como artista.</p>
                </div>

                <!-- Sesión activa: main.js deriva a /artist/login, que muestra
                     "Ya iniciaste sesión" (Figma 2001:3334). -->

                <!-- El flujo de beta captura nombre, email, ciudad y estilo:
                     crea/reanuda el borrador con esos datos y deriva al wizard
                     /register-artist, donde se completa el resto. -->
                <form id="beta-form" class="wo-auth-form" onsubmit="handleRegistration(event)" novalidate>
                    <div class="wo-beta-field">
                        <label class="wo-beta-label" for="beta-fullname">Nombre completo <span class="req">*</span></label>
                        <input id="beta-fullname" type="text" class="wo-beta-input input-fullname" placeholder="Tu nombre"
                            required autocomplete="name" data-clarity-mask="true">
                    </div>

                    <div class="wo-auth-fieldrow">
                        <div class="wo-beta-field">
                            <label class="wo-beta-label" for="beta-email">Email <span class="req">*</span></label>
                            <input id="beta-email" type="email" class="wo-beta-input input-email" placeholder="tu@email.com"
                                required autocomplete="email" data-clarity-mask="true">
                        </div>
                        <div class="wo-beta-field">
                            <label class="wo-beta-label" for="beta-city">Ciudad</label>
                            <input id="beta-city" type="text" class="wo-beta-input input-city" placeholder="Buenos Aires"
                                autocomplete="address-level2">
                        </div>
                    </div>

                    <div class="wo-beta-field">
                        <label class="wo-beta-label" for="beta-style">Estilo <span class="req">*</span></label>
                        <select id="beta-style" class="wo-beta-input wo-beta-select input-style" required>
                            <option value="" selected disabled>Seleccioná tu estilo principal</option>
                        </select>
                    </div>

                    <label class="wo-beta-terms" for="beta-terms">
                        <input type="checkbox" id="beta-terms" required>
                        <span>Acepto los <a href="/legal/terms" target="_blank" rel="noopener">términos y condiciones</a></span>
                    </label>

                    <button type="submit" class="wo-beta-submit btn-register btn-register-primary">
                        <span class="btn-text">Registrarme</span>
                        <i data-wo-icon="arrow-right" aria-hidden="true"></i>
                    </button>

                    <div id="form-message" class="form-message" role="status"></div>
                </form>

                <div class="wo-auth-or" role="separator">O continuá con</div>

                <div class="wo-auth-social">
                    <span class="wo-auth-reco"><i data-wo-icon="star" aria-hidden="true"></i>Recomendado</span>
                    <div class="wo-auth-social-row">
                        <button type="button" class="wo-beta-social social-btn" data-social="instagram"
                            onclick="handleSocialLogin('instagram')" aria-label="Continuar con Instagram">
                            <i data-wo-icon="instagram" aria-hidden="true"></i>
                            <span class="btn-text">Instagram</span>
                        </button>
                        <button type="button" class="wo-beta-social social-btn" data-social="email"
                            onclick="focusBetaForm()" aria-label="Continuar con email">
                            <i data-wo-icon="mail" aria-hidden="true"></i>
                            <span class="btn-text">Email</span>
                        </button>
                        <button type="button" class="wo-beta-social social-btn" data-social="facebook"
                            onclick="handleFacebookSignup()" aria-label="Continuar con Facebook">
                            <img class="wo-auth-brand-logo" src="/artist/login/assets/facebook.svg" width="17" height="17" alt="" aria-hidden="true">
                            <span class="btn-text">Facebook</span>
                        </button>
                    </div>
                </div>

                <p class="wo-beta-haveaccount">¿Ya tenés cuenta?
                    <a href="/artist/login" onclick="event.preventDefault(); openLoginModal();">Ingresá</a>
                </p>
            </div>

        </div>
    </main>

</div>

<script src="/shared/js/artist-auth.js"></script>
<script src="/shared/js/artist-registration-progress.js"></script>
<script src="/shared/js/instagram-import.js"></script>
<script src="/shared/js/main.js?v=20261028-figma-final"></script>

</body>

</html>
