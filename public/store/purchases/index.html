<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Modo demo (debe ir antes de cualquier otro script) -->
    <script src="/shared/js/wo-demo.js?v=20260903-1"></script>
    <title>Mis compras · Store · We Ötzi</title>
    <meta name="description" content="Tus pedidos de la Store de We Ötzi: pagos, envíos, licencias de uso y descargas.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Design system Bauhaus + Store -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/store-ds.css">
    <link rel="stylesheet" href="/shared/css/store-buyer.css">
    <script src="/shared/js/wo-icons.js" defer></script>
    <!-- Canal de soporte del producto (chat): lo abre el link de ayuda del pedido -->
    <script src="/shared/js/support-loader.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="wo-app sts-page">
    <div id="store-topbar"></div>

    <main class="sts-shell" id="stb-main">
        <!-- Cargando -->
        <section class="stb-state" id="stb-loading" aria-live="polite">
            <div class="stb-loading-box"><span class="wo-spinner" aria-hidden="true"></span> Cargando tus compras</div>
        </section>

        <!-- Mensajes: Store apagada, sin sesión, pedido no encontrado -->
        <section class="stb-state" id="stb-message" hidden aria-live="polite"></section>

        <!-- Lista de pedidos -->
        <section class="stb-state" id="stb-list" hidden aria-labelledby="stb-list-title">
            <header class="sts-header">
                <p class="sts-eyebrow">Store</p>
                <h1 class="sts-title" id="stb-list-title" tabindex="-1">Mis compras</h1>
                <p class="sts-sub">Tus pedidos, licencias de uso y descargas. Tocá un pedido para ver cómo pagarlo, seguir el envío o bajar los archivos.</p>
            </header>
            <div id="stb-orders"></div>
        </section>

        <!-- Detalle del pedido (?pedido=<id>) -->
        <section class="stb-state" id="stb-detail" hidden aria-labelledby="stb-detail-title"></section>
    </main>

    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/store-model.js"></script>
    <script src="/shared/js/data/store-repo.js"></script>
    <script src="/shared/js/store-shell.js"></script>
    <script src="/shared/js/store-purchases.js"></script>
</body>
</html>
