<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Publicá tu solicitud de tatuaje</title>

    <!-- Design system (Bauhaus) -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/job-board-request.css">
    <script src="/shared/js/wo-icons.js" defer></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

    <!-- Config & Logging -->
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/quotations-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/data/studios-repo.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/email-client.js"></script>
    <script src="/shared/js/currency-utils.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/logging-loader.js"></script>

    <!-- Google Maps Places API - loaded dynamically from config -->
    <script>
        // Define the callback that Google Maps API expects
        window.initGooglePlaces = function() {
            console.log('[Job Board] Google Places API loaded');
        };
        function loadGoogleMapsWhenReady() {
            if (window.CONFIG && window.CONFIG.googleMaps && window.CONFIG.googleMaps.apiKey) {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${window.CONFIG.googleMaps.apiKey}&libraries=places&loading=async&callback=initGooglePlaces`;
                script.async = true;
                document.head.appendChild(script);
            } else {
                if (!window._googleMapsRetryCount) window._googleMapsRetryCount = 0;
                window._googleMapsRetryCount++;
                if (window._googleMapsRetryCount < 50) {
                    setTimeout(loadGoogleMapsWhenReady, 100);
                }
            }
        }
        document.addEventListener('DOMContentLoaded', loadGoogleMapsWhenReady);
    </script>
</head>

<body class="wo-app jbr-body">

    <!-- Main Container -->
    <main class="jbr-shell">

        <!-- Header with Progress -->
        <header class="jbr-header">
            <a href="/" class="jbr-brand">← <span>WE ÖTZI</span></a>
            <div class="jbr-progress">
                <div class="wo-progress jbr-progress-track">
                    <span id="jb-progress-fill"></span>
                </div>
                <span class="jbr-progress-label" id="jb-progress-label"></span>
            </div>
        </header>

        <!-- Back Button -->
        <button type="button" class="wo-btn wo-btn--ghost wo-btn--s jbr-back" id="jb-btn-back" style="display: none;">← Volver</button>

        <!-- Steps Container (rendered dynamically by JS) -->
        <div id="steps-container" class="jbr-steps"></div>

        <!-- Navigation Footer -->
        <footer class="jbr-footer">
            <div class="jbr-kbd-hint" id="jb-kbd-hint">
                <span>Presioná</span>
                <kbd>Enter</kbd>
                <span>para continuar</span>
            </div>
            <button type="button" class="wo-btn wo-btn--hard jbr-next" id="jb-btn-next">Siguiente →</button>
        </footer>

    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="wo-overlay jbr-overlay hidden">
        <div class="jbr-overlay-box">
            <div class="wo-spinner"></div>
            <p class="wo-meta">Publicando tu solicitud…</p>
        </div>
    </div>

    <!-- Main Script -->
    <script src="/shared/js/heic-converter.js"></script>
    <script src="/shared/js/job-board-request.js"></script>
</body>

</html>
