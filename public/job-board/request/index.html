<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Ötzi · Publicá tu idea</title>
    <meta name="description" content="Publicá tu idea de tatuaje en el Job Board de We Ötzi: contá los detalles, sumá referencias y recibí propuestas de tatuadores.">

    <!-- Design system Bauhaus -->
    <link rel="stylesheet" href="/shared/css/ds/tokens.css">
    <link rel="stylesheet" href="/shared/css/ds/components.css">
    <link rel="stylesheet" href="/shared/css/job-board-request-ds.css">
    <script src="/shared/js/wo-icons.js" defer></script>

    <!-- Supabase + procesamiento de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

    <!-- Google Maps Places API - se carga dinámicamente desde config -->
    <script>
        // Define the callback that Google Maps API expects
        window.initGooglePlaces = function() {
            console.log('[Job Board] Google Places API loaded');
        };
        function loadGoogleMapsWhenReady() {
            if (window.CONFIG && window.CONFIG.googleMaps && window.CONFIG.googleMaps.apiKey) {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${window.CONFIG.googleMaps.apiKey}&libraries=places&loading=async&callback=initGooglePlaces`;
                script.async = true;
                document.head.appendChild(script);
            } else {
                if (!window._googleMapsRetryCount) window._googleMapsRetryCount = 0;
                window._googleMapsRetryCount++;
                if (window._googleMapsRetryCount < 50) {
                    setTimeout(loadGoogleMapsWhenReady, 100);
                }
            }
        }
        document.addEventListener('DOMContentLoaded', loadGoogleMapsWhenReady);
    </script>
</head>

<body class="wo-app jbrq-body">

    <!-- Topbar de cliente -->
    <header class="wo-topbar">
        <div class="wo-topbar-left">
            <a class="wo-topbar-brand" href="/client/dashboard">WE ÖTZI</a>
            <nav class="wo-topbar-nav" aria-label="Navegación principal de cliente">
                <a class="wo-topbar-item" href="/client/dashboard#mis-cotizaciones">Cotizaciones</a>
                <a class="wo-topbar-item is-active" aria-current="page" href="/job-board/request">Job board</a>
                <a class="wo-topbar-item" href="/marketplace">Explorar artistas</a>
                <a class="wo-topbar-item" href="/explore">Tattoo globe</a>
            </nav>
        </div>
        <div class="wo-topbar-right">
            <a class="jbrq-o-link" href="/client/dashboard" title="Tu panel" aria-label="Ir a tu panel"><span class="wo-o-tile" aria-hidden="true">Ö</span></a>
            <button type="button" class="wo-btn wo-btn--danger wo-btn--s wo-btn--mono wo-hidden" id="jbrq-logout">Log out</button>
        </div>
    </header>

    <main class="jbrq-main">
        <div class="wo-container">

            <!-- Fila utilitaria: volver + estado de la publicación -->
            <div class="jbrq-utility">
                <a id="jbrq-back" class="wo-meta jbrq-back" href="/client/dashboard">← Volver al dashboard</a>
                <span class="wo-tag wo-tag--archived jbrq-badge" id="jbrq-badge">Borrador</span>
            </div>

            <!-- Stepper del flujo (en esta página solo el paso 1 está activo) -->
            <ol class="jbrq-stepper" id="jbrq-stepper" hidden aria-label="Etapas de tu publicación">
                <li class="jbrq-step is-active" aria-current="step">
                    <span class="jbrq-step-box">1</span>
                    <span class="jbrq-step-label">Borrador</span>
                </li>
                <li class="jbrq-step-line" aria-hidden="true"></li>
                <li class="jbrq-step">
                    <span class="jbrq-step-box">2</span>
                    <span class="jbrq-step-label">Publicada</span>
                </li>
                <li class="jbrq-step-line" aria-hidden="true"></li>
                <li class="jbrq-step">
                    <span class="jbrq-step-box">3</span>
                    <span class="jbrq-step-label">Postulaciones</span>
                </li>
                <li class="jbrq-step-line" aria-hidden="true"></li>
                <li class="jbrq-step">
                    <span class="jbrq-step-box">4</span>
                    <span class="jbrq-step-label">Selección</span>
                </li>
                <li class="jbrq-step-line" aria-hidden="true"></li>
                <li class="jbrq-step">
                    <span class="jbrq-step-box">5</span>
                    <span class="jbrq-step-label">Reserva confirmada</span>
                </li>
            </ol>

            <!-- Vistas del wizard (inspiración · formulario · revisión · cuenta) -->
            <div id="jbrq-view" class="jbrq-view" aria-live="polite"></div>
        </div>
    </main>

    <!-- Overlay de publicación -->
    <div id="loading-overlay" class="wo-overlay wo-hidden">
        <div class="jbrq-overlay-box">
            <div class="wo-spinner"></div>
            <p class="wo-meta">Publicando tu idea…</p>
        </div>
    </div>

    <!-- Datos y módulo de página -->
    <script src="/shared/js/config-manager.js"></script>
    <script src="/shared/js/data/postgrest-client.js"></script>
    <script src="/shared/js/data/clients-repo.js"></script>
    <script src="/shared/js/data/artists-repo.js"></script>
    <script src="/shared/js/support-loader.js" defer></script>
    <script src="/shared/js/logging-loader.js"></script>
    <script src="/shared/js/heic-converter.js"></script>
    <script src="/shared/js/job-board-request.js"></script>
</body>

</html>
