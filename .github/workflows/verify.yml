name: Verify delivery
on:
  push:
    branches: [main, 'valentina/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests and release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Version, changelog and credential checks
        run: node scripts/release/check-policy.cjs
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node --check server.js
      - run: npm test
      - name: Record publication instructions
        run: |
          echo '### Publication' >> "$GITHUB_STEP_SUMMARY"
          echo 'The server reads verified commits from GitHub. No SSH or production secrets exist in this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
